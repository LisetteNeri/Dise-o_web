<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Contacto</title>
    <link rel="stylesheet" href="/assets/styles/styles-generales.css">
    <link rel="stylesheet" href="/assets/styles/Formulario de contacto.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"> 
</head>
<body>
    <div id="navbar-container"></div>

    <form>
        <h2>¡Contactame!</h2> 

        <div class="input-group">
            <span class="input-group-text"> Nombre y apellidos</span>
            <input type="text" aria-label="First name" class="form-control">
            <input type="text" aria-label="Last name" class="form-control">
        </div>
        <br>
        <div class="input-group flex-nowrap">
            <span class="input-group-text" id="addon-wrapping"> +(55)</span>
            <input type="text" class="form-control" placeholder="5678909999" aria-label="Username" aria-describedby="addon-wrapping">
        </div>
        <br>
        <div class="form-floating mb-3">
            <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com">
            <label for="floatingInput">Correo electronico</label>
        </div>

         <select class="form-select" aria-label="Default select example">
            <option selected>Asunto/Motivo</option>
            <option value="1">Oferta laboral</option>
            <option value="2">Colaboración</option>
            <option value="3">Consulta técnica </option>
        </select>
        <br>
        <div class="form-floating">
            <textarea class="form-control" placeholder="Leave a comment here" id="floatingTextarea"></textarea>
            <label for="floatingTextarea">Mensaje</label>
        </div>

        
        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="exampleCheck1">
            <label class="form-check-label" for="exampleCheck1">Acepto terminos y condiciones</label>
        </div>
        <button type="submit" class="btn btn-primary">Enviar</button>
    </form>
    
    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/main.js"></script>
    
    <script>
    // Desde la raíz, las carpetas están al mismo nivel
    loadComponent('navbar-container', '../components/navbar.html');
    loadComponent('footer-container', '../components/footer.html');
    </script>
</body>
</html>
