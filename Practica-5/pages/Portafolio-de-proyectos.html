<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards Proyect</title>
    <link rel="stylesheet" href="/assets/styles/styles-generales.css">
    <link rel="stylesheet" href="/assets/styles/Portafolio-de-proyectos.css">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div id="navbar-container"></div>

    <div id="carouselExampleCaptions" class="carousel slide glass-container">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
            <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="1" aria-label="Slide 2"></button>
            <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="2" aria-label="Slide 3"></button>
        </div>
        <div class="carousel-inner">

            <div class="carousel-item active">
                <img src="/assets/img/E-commers.png" class="d-block w-5" alt="Pagina de un e-commerce">
                <div class="carousel-caption d-none d-md-block">
                    <a href="https://empowerfit.netlify.app/ " class="btn btn-info" target="_blank">Ver más</a>
                </div>
            </div>

            <div class="carousel-item">
                <img src="/assets/img/Login-Evaluacion-Ingles.png" class="d-block w-100" alt="...">
                <div class="carousel-caption d-none d-md-block">
                    <a href="/pages/Evaluacion-ingles.html" class="btn btn-info">Ver más</a>
                </div>
            </div>

            <div class="carousel-item">
                <img src="/assets/img/Login-Sistema-Consulta.png" class="d-block w-100" alt="...">
                <div class="carousel-caption d-none d-md-block">
                    <a href="/pages/Sistema-Consulta.html " class="btn btn-info">Ver más</a>

                </div>
            </div>

        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/main.js"></script>
    <script>
        loadComponent('navbar-container', '../components/navbar.html');
        loadComponent('footer-container', '../components/footer.html');
    </script>
</body>
</html>
